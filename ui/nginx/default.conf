
server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), clipboard-write=(self), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), usb=()" always;

  location /helpdesk/ {
    try_files $uri $uri/ /helpdesk/index.html;
  }

  location /helpdesk {
    return 301 /helpdesk/;
  }

  location / {
    return 301 /helpdesk/;
  }
  error_page 400 401 403 404 405 500 502 503 504 /security-error.html;

  location = /security-error.html {
    internal;
    default_type text/html;
    return 404 "<!doctype html><html><head><title>Request error</title></head><body><h1>Request error</h1><p>The requested resource could not be served.</p></body></html>";
  }
}
